name: Check Brandify Creative Rebuild
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  production-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      # package-lock.json in the original main branch was already out of sync.
      - name: Install declared dependencies
        run: npm install --no-audit --no-fund --package-lock=false
      - name: Build app
        run: npm run build
